<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="./css/main.css">
</head>

<body>
    <header>
        <a href="/">
            <h1>Calculator</h1>
        </a>
    </header>
    <main>
        <section class="app">
            <div class="calc">
                <div class="display">
                    <p class="equation">129 + 41</p>
                    <p class="result">99</p>
                </div>
                <div class="buttons-ui">
                    <div class="row">
                        <button>7</button>
                        <button>8</button>
                        <button>9</button>
                        <button>/</button>
                    </div>
                    <div class="row">
                        <button>4</button>
                        <button>5</button>
                        <button>6</button>
                        <button>*</button>
                    </div>
                    <div class="row">
                        <button>1</button>
                        <button>2</button>
                        <button>3</button>
                        <button>-</button>
                    </div>
                    <div class="row">
                        <button>.</button>
                        <button>0</button>
                        <button>=</button>
                        <button>+</button>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <footer><a href="https://github.com/Yahia-Emara">Yahia Emara</a></footer>
</body>

</html>
